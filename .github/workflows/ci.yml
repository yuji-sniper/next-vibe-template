name: CI

on:
  push:
    branches:
      - "**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: ./.github/workflows/composite/setup-node
      - name: Lint
        run: pnpm lint

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: ./.github/workflows/composite/setup-node
      - name: Format
        run: pnpm fmt

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: ./.github/workflows/composite/setup-node
      - name: Type check
        run: pnpm type:gen && pnpm type:check
        env:
          SKIP_ENV_VALIDATION: true

